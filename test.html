<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Успешная оплата</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #F4F6F8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* 🟢 ЭТАП 1: ЛАЗЕРНЫЕ ЛИНИИ ПО БОКАМ (СВЕРТЫВАНИЕ В КВАДРАТ) */
        .screen-border {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            border: 3px solid #14C856;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 0 8px rgba(20, 200, 86, 0.6));
            
            /* Сначала линии летят и срастаются, затем схлопываются в центр */
            animation: 
                borderDraw 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                borderCollapse 0.25s cubic-bezier(0.6, -0.28, 0.735, 0.045) 0.4s forwards;
        }

        @keyframes borderDraw {
            0% { clip-path: inset(0 50% 0 50%); opacity: 0; }
            100% { clip-path: inset(0 0 0 0); opacity: 1; }
        }

        /* 🟢 ЭТАП 2: ВСЯ АНИМАЦИЯ УХОДИТ В ЦЕНТР */
        @keyframes borderCollapse {
            0% { top: 0; left: 0; right: 0; bottom: 0; opacity: 1; border-radius: 0; }
            90% { opacity: 1; }
            100% { 
                top: 50%; left: 50%; right: 50%; bottom: 50%; 
                width: 10px; height: 10px; 
                transform: translate(-50%, -50%); 
                opacity: 0;
                border-radius: 50%;
                background: #14C856;
                box-shadow: 0 0 40px 20px rgba(20, 200, 86, 0.8);
            }
        }

        /* ВСПЫШКА В ЦЕНТРЕ ПРИ УДАРЕ */
        .center-burst {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(20, 200, 86, 0.8) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: 9998;
            animation: burst 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.55s forwards;
        }

        @keyframes burst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        }

        /* КОНТЕЙНЕР ДЛЯ ГАЛОЧКИ И ТЕКСТА (ЭТАП 3) */
        .intro-stage {
            position: absolute;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        /* 🟢 ЭТАП 3: РИСУЕТСЯ ГАЛОЧКА И ТЕКСТ */
        .svg-checkmark {
            width: 80px; height: 80px;
            display: block;
            margin: 0 auto 16px auto;
        }
        .checkmark-circle {
            fill: none;
            stroke: #14C856;
            stroke-width: 4;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: strokeCircle 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #14C856;
            stroke-width: 5;
            fill: none;
            animation: strokeCheck 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.9s forwards;
        }

        h1.main-title {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            opacity: 0;
            transform: translateY(10px);
            animation: textFadeIn 0.4s ease-out 0.8s forwards;
        }

        /* Убираем заголовок из самой карточки, так как он теперь анимируется выше */
        .success-card h1 { display: none; }

        @keyframes strokeCircle { to { stroke-dashoffset: 0; } }
        @keyframes strokeCheck { to { stroke-dashoffset: 0; } }
        @keyframes textFadeIn { to { opacity: 1; transform: translateY(0); } }

        /* 🟢 ЭТАП 4: ПОЯВЛЕНИЕ ЧЕКА (СДВИГАЕТСЯ ВНИЗ И РАСКРЫВАЕТСЯ) */
        .success-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            padding: 120px 24px 32px 24px; /* Оставляем место сверху под заголовок */
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04);
            z-index: 10;
            
            /* Появляется позже всех, когда галочка уже готова */
            opacity: 0;
            transform: scale(0.95) translateY(30px);
            animation: cardReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ВНУТРЕННОСТИ ЧЕКА */
        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 24px; }
        .info-box {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.01);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 22px; }

        .btn-close {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(20, 200, 86, 0.2);
            margin-bottom: 20px;
        }
        .btn-close:active { transform: scale(0.98); filter: brightness(0.9); }
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Линии по бокам -->
    <div class="screen-border"></div>

    <!-- Взрыв в центре -->
    <div class="center-burst"></div>

    <!-- Блок Галочки и Текста (Этап 3) -->
    <div class="intro-stage">
        <svg class="svg-checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25"/>
            <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h1 class="main-title">Успешная оплата!</h1>
    </div>

    <!-- Блок Чека (Этап 4) -->
    <div class="success-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-box">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-close">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

    <!-- СКРИПТ ДЛЯ МОБИЛЬНОЙ ВИБРАЦИИ (HAPTIC) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Вибрация сработает ровно в момент удара в центр (через 550мс после загрузки)
            setTimeout(() => {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate([80, 50, 100]); // Двойной ИИ-клик корпуса
                }
            }, 550);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Exploding Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #F4F6F8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🟢 СЛОЖНАЯ СИСТЕМА СИНХРОННОГО РАСКРЫТИЯ РАМОК ИЗ ЦЕНТРА */
        .border-system {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            z-index: 9999;
        }

        .premium-laser {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #14C856;
            stroke-width: 4px;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px rgba(20, 200, 86, 0.6)) drop-shadow(0 0 4px rgba(20, 200, 86, 0.9));
            
            /* Настройка старта анимации строго из центра боковых граней */
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            
            /* 1.4 секунды на расползание по границам, затем мигание и затухание */
            animation: 
                expandBorders 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                blinkAndFade 0.8s cubic-bezier(0.25, 1, 0.5, 1) 1.4s forwards;
        }

        /* 🎬 АНИМАЦИЯ РАСПОЛЗАНИЯ ЛИНИЙ ИЗ СЕРЕДИНЫ БОКОВ ВВЕРХ И ВНИЗ */
        @keyframes expandBorders {
            0% {
                stroke-dasharray: 0 4000;
                stroke-dashoffset: 2000; /* Старт в центральной координате */
            }
            100% {
                stroke-dasharray: 4000 0;
                stroke-dashoffset: 0; /* Полное заполнение периметра */
            }
        }

        /* 🎬 МИГАНИЕ И ПОЛНОЕ УГАСАНИЕ РАМКИ И ГАЛОЧКИ */
        @keyframes blinkAndFade {
            0% { opacity: 1; filter: drop-shadow(0 0 15px rgba(20, 200, 86, 0.8)); }
            25% { opacity: 0.2; }
            50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(20, 200, 86, 1)); }
            75% { opacity: 0.4; }
            100% { opacity: 0; display: none; filter: drop-shadow(0 0 0px rgba(0,0,0,0)); }
        }

        /* 🌌 АНИМАЦИЯ ГАЛОЧКИ В ПОЛНОМ СИНХРОНЕ С РАМКОЙ */
        .animation-core {
            position: absolute;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Вся центральная ИИ-вспышка гаснет вместе с рамками */
            animation: blinkAndFade 0.8s cubic-bezier(0.25, 1, 0.5, 1) 1.4s forwards;
        }

        .apple-checkmark-svg {
            width: 96px; height: 96px;
            filter: drop-shadow(0 8px 20px rgba(20, 200, 86, 0.3));
        }

        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            /* Рисуется ровно 1.4 секунды */
            animation: syncCircle 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            /* Идеально завершается к отметке 1.4 секунды */
            animation: syncCheck 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards;
        }

        @keyframes syncCircle { to { stroke-dashoffset: 0; } }
        @keyframes syncCheck { to { stroke-dashoffset: 0; } }

        /* 🧾 ЭЛЕГАНТНОЕ ПОЯВЛЕНИЕ ЧЕКА ПОСЛЕ ТОГО, КАК ВСЁ ПОГАСЛО */
        .premium-receipt-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            padding: 36px 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04);
            z-index: 10;
            
            opacity: 0;
            transform: scale(0.96) translateY(20px);
            /* Выплывает строго на 2.0 секунде, когда световое шоу полностью завершено */
            animation: contentReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards;
        }

        h1 { font-size: 24px; font-weight: 700; color: #111111; margin-bottom: 8px; letter-spacing: -0.4px; }
        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 24px; }

        .info-container {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.01);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 22px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.2);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes contentReveal {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 🟢 SVG-система рамок с раскрытием из центральной оси -->
    <svg class="border-system">
        <rect class="premium-laser" x="0" y="0" width="100%" height="100%" />
    </svg>

    <!-- 🪐 ЯДРО АНИМАЦИИ (Галочка) -->
    <div class="animation-core">
        <svg class="apple-checkmark-svg" viewBox="0 0 52 52">
            <circle class="circle-path" cx="26" cy="26" r="24.5"/>
            <path class="check-path" d="M16 27.5 L22.5 34 L36.5 19.5"/>
        </svg>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (Появляется на чистом экране в конце) -->
    <div class="premium-receipt-card">
        <h1>Оплата прошла успешно!</h1>
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>

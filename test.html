<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | True Siri Border Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #FFFFFF; /* Элитный белый фон */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🟢 ТО САМОЕ ВОЛНИСТОЕ НЕОНОВОЕ СВЕЧЕНИЕ СТРОГО ПО ГРАНИЦАМ */
        .siri-border-container {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            z-index: 10;
        }

        .siri-wave-path {
            fill: none;
            stroke: url(#siri-liquid-gradient);
            stroke-width: 8px; /* Сочная широкая неоновая нить */
            stroke-linecap: round;
            
            /* Сложный ИИ-эффект: превращает линию в объёмное, глубокое жидкое стекло */
            filter: url(#siri-neon-glow);
            
            /* Настройка старта движения из точек "1" */
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            
            /* Ровно 1.6 секунды на растекание волн, затем пульсация и затухание */
            animation: 
                liquidFlow 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                siriBreatheAndFade 1.0s cubic-bezier(0.25, 1, 0.5, 1) 1.6s forwards;
        }

        /* 🎬 АНИМАЦИЯ: ГУСТОЕ ТЕЧЕНИЕ ИЗ ТОЧЕК "1" С БОКОВ ЭКРАНА */
        @keyframes liquidFlow {
            0% {
                stroke-dasharray: 0 4000;
                stroke-dashoffset: -1000; /* Идеальное смещение в центральные точки 1 */
            }
            100% {
                stroke-dasharray: 4000 0;
                stroke-dashoffset: 0; /* Рамки полностью сомкнулись */
            }
        }

        /* 🎬 АНИМАЦИЯ: ДВА МЯГКИХ СВЕТОВЫХ ВЗДОХА И УГАСАНИЕ РАМКИ */
        @keyframes siriBreatheAndFade {
            0% { opacity: 1; transform: scale(1); }
            30% { opacity: 0.3; transform: scale(0.995); }
            60% { opacity: 1; transform: scale(1.002); }
            100% { opacity: 0; visibility: hidden; }
        }

        /* 🪐 2. ЕДИНОЕ ИИ-ЯДРО (ГАЛОЧКА + ТЕКСТ) */
        .core-success-block {
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 32%;
            transform: translateY(-50%);
        }

        .apple-checkmark-svg {
            width: 100px; height: 100px;
            margin-bottom: 24px;
            filter: drop-shadow(0 10px 20px rgba(20, 200, 86, 0.15));
        }

        /* Круг рисуется в идеальном синхроне с течением рамок */
        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: syncCircle 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Стрелка вылетает ровно к моменту смыкания */
        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: syncCheck 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
        }

        @keyframes syncCircle { to { stroke-dashoffset: 0; } }
        @keyframes syncCheck { to { stroke-dashoffset: 0; } }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(12px);
            animation: titleFadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 1.3s forwards;
        }
        @keyframes titleFadeIn { to { opacity: 1; transform: translateY(0); } }


        /* 🧾 3. ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (ВЫЕЗЖАЕТ ИЗ ФОНА В КОНЦЕ) */
        .premium-receipt-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.04);
            z-index: 10;
            position: absolute;
            bottom: 6%;
            
            opacity: 0;
            transform: scale(0.96) translateY(35px);
            /* Проявляется на 2.4 секунде, когда внешние границы полностью погасли */
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        .info-container {
            background: #F8F9FA;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.005);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.15);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes receiptRevealEase {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 🪐 СЛОЖНАЯ ИИ-МАТРИЦА СВЕТА И ВОЛНИСТЫХ ГРАНИЦ -->
    <svg class="siri-border-container" viewBox="0 0 400 800" preserveAspectRatio="none">
        <defs>
            <!-- Тот самый переливающийся градиент Siri (Изумруд + Живая Мята) -->
            <linearGradient id="siri-liquid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#14C856" />
                <stop offset="30%" stop-color="#A3F7B5" />
                <stop offset="70%" stop-color="#0ED95A" />
                <stop offset="100%" stop-color="#14C856" />
            </linearGradient>

            <!-- Фильтр глубокого объемного свечения на 30-40px внутрь и наружу экрана -->
            <filter id="siri-neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="18" result="blur1" />
                <feGaussianBlur stdDeviation="6" result="blur2" />
                <feMerge>
                    <feMergeNode in="blur1" />
                    <feMergeNode in="blur2" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- 🌊 Путь прописан через кривые Безье (Q): линии идут строго по границам, но плавно изгибаются волнами -->
        <path class="siri-wave-path" d="
            M 400 400 
            Q 394 200 400 0 
            L 0 0 
            Q 6 200 0 400 
            Q 6 600 0 800 
            L 400 800 
            Q 394 600 400 400 
            Z" 
        />
    </svg>

    <!-- 🪐 ЕДИНОЕ ИИ-ЯДРО -->
    <div class="core-success-block">
        <svg class="apple-checkmark-svg" viewBox="0 0 60 60">
            <circle class="circle-path" cx="30" cy="30" r="25"/>
            <path class="check-path" d="M20 31 L26.5 37.5 L40.5 23"/>
        </svg>
        <h1 class="main-title">Оплата прошла успешно!</h1>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-close btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>

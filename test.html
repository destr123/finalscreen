<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #FFFFFF; /* Чистый белый фон */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        /* 🪐 ХОЛСТ ДЛЯ АВТОНОМНОГО КОНФЕТТИ */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 🪐 ЦЕНТРАЛЬНЫЙ БЛОК */
        .status-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            width: 100%;
            z-index: 10;
        }

        .apple-checkmark-svg {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 20px rgba(20, 200, 86, 0.15));
            overflow: visible;
        }

        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: drawCircle 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        /* ПОЭТАПНЫЙ ВЫЛЕТ СЛОВ */
        .word-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .word {
            font-size: 28px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(15px);
        }

        .word-1 { animation: wordPopIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards; }
        .word-2 { animation: wordPopIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards; }
        .word-3 {
            color: #14C856;
            font-size: 32px;
            animation: wordPopInIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards;
        }

        @keyframes wordPopIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes wordPopInIn { to { opacity: 1; transform: translateY(0) scale(1.05); } }

        /* 🧾 ЧЕК DXS PAY */
        .premium-receipt-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
            z-index: 10;
            
            opacity: 0;
            transform: scale(0.96) translateY(30px);
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        .info-container {
            background: #F8F9FA;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.005);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.15);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes drawCircle { to { stroke-dashoffset: 0; } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }
        @keyframes receiptRevealEase { to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>

    <!-- Нативный холст для конфетти -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 🪐 ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
    <div class="status-center">
        <svg class="apple-checkmark-svg" viewBox="0 0 60 60">
            <circle class="circle-path" cx="30" cy="30" r="25"/>
            <path class="check-path" d="M20 31 L26.5 37.5 L40.5 23"/>
        </svg>
        
        <div class="word-container">
            <div class="word word-1">Оплата</div>
            <div class="word word-2">прошла</div>
            <div class="word word-3">успешно!</div>
        </div>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-close btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

    <!-- 🚀 НАДЁЖНЫЙ АВТОНОМНЫЙ ДВИЖОК КОНФЕТТИ НА ЧИСТОМ JS -->
    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const colors = ['#14C856', '#A3F7B5', '#0ED95A', '#FFD700', '#FF5722'];
        let particles = [];

        class Particle {
            constructor(x, y, isSide, sideAngle) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                if (isSide) {
                    // Боковые залпы
                    let angle = sideAngle + (Math.random() - 0.5) * 0.4;
                    let speed = Math.random() * 12 + 10;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    // Центральный взрыв вверх
                    this.vx = (Math.random() - 0.5) * 12;
                    this.vy = -(Math.random() * 10 + 10);
                }
                
                this.gravity = 0.35;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 10;
                this.opacity = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= 0.98; // Легкое сопротивление воздуха
                this.rotation += this.rotationSpeed;
                if (this.vy > 2) {
                    this.opacity -= 0.015; // Медленное растворение при падении
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                // Рисуем прямоугольные конфеттишки
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles = particles.filter(p => p.opacity > 0 && p.y < height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            if (particles.length > 0) {
                requestAnimationFrame(animate);
            }
        }

        function fireConfetti() {
            // 1. Центральный салют под словом успешно
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(width / 2, height * 0.35, false));
            }
            // 2. Левый и правый фонтаны для масштаба стадиона
            setTimeout(() => {
                for (let i = 0; i < 30; i++) {particles.push(new Particle(0, height * 0.5, true, -Math.PI / 4)); // Стреляет вправо-вверхparticles.push(new Particle(width, height * 0.5, true, -3 * Math.PI / 4)); // Стреляет влево-вверх}}, 150);animate();}// Запуск триумфа ровно на 1300мс в синхроне со словом "успешно!"setTimeout(fireConfetti, 1300);

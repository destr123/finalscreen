<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Ultimate Premium Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #FFFFFF; /* Чистый премиальный белый фон с первой секунды */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🌊 1. ВОЛНИСТАЯ СИСТЕМА РАМОК С ГЛУБОКИМ СВЕЧЕНИЕМ 20-30px */
        .wave-container {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            z-index: 9999;
        }

        .liquid-wave-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 6px;
            stroke-linecap: round;
            
            /* ТО САМОЕ СВЕЧЕНИЕ НА 20-30px ВНУТРЬ ЭКРАНА */
            filter: drop-shadow(0 0 25px rgba(20, 200, 86, 0.65)) drop-shadow(0 0 8px rgba(20, 200, 86, 0.8));
            
            /* Настройка течения из точек "1" */
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            
            /* Плавное течение волн 1.5с + мигание и угасание */
            animation: 
                liquidFlow 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                blinkAndFadeOut 0.8s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
        }

        /* Анимация плавного растекания из середины боковых рамок */
        @keyframes liquidFlow {
            0% { stroke-dasharray: 0 4000; stroke-dashoffset: -1000; }
            100% { stroke-dasharray: 4000 0; stroke-dashoffset: 0; }
        }

        /* Мягкое ИИ-мигание и полное растворение рамок в белом фоне */
        @keyframes blinkAndFadeOut {
            0% { opacity: 1; filter: drop-shadow(0 0 35px rgba(20, 200, 86, 0.9)); }
            30% { opacity: 0.3; }
            60% { opacity: 1; filter: drop-shadow(0 0 45px rgba(20, 200, 86, 1)); }
            100% { opacity: 0; visibility: hidden; }
        }

        /* 🪐 2. ЕДИНОЕ ИИ-ЯДРО: ГАЛОЧКА + ТЕКСТ (БЕЗ ВСЯКИХ БЕЛЫХ БЛОКОВ) */
        .core-success-block {
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 30%; /* Фиксируем по центру верхней половины */
            transform: translateY(-50%);
        }

        .apple-checkmark-svg {
            width: 96px; height: 96px;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 24px rgba(20, 200, 86, 0.25));
        }

        /* Синхронное рисование круга галочки */
        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: syncCircle 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Синхронное рисование стрелки */
        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: syncCheck 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.7s forwards;
        }

        @keyframes syncCircle { to { stroke-dashoffset: 0; } }
        @keyframes syncCheck { to { stroke-dashoffset: 0; } }

        /* Текст неразрывно связан с галочкой и НЕ исчезает */
        .main-title {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(10px);
            animation: titleFadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 1.1s forwards;
        }
        @keyframes titleFadeIn { to { opacity: 1; transform: translateY(0); } }


        /* 🧾 3. ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (ПРОЯВЛЯЕТСЯ ПОЗЖЕ СНИЗУ) */
        .premium-receipt-card {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            /* Очень мягкая премиальная тень Apple */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
            z-index: 10;
            position: absolute;
            bottom: 8%; /* Встает в нижнюю часть экрана */
            
            opacity: 0;
            transform: scale(0.97) translateY(30px);
            /* Плавно материализуется на 2.2 секунде, когда рамки погасли */
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        .info-container {
            background: #F8F9FA;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.01);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.15);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes receiptRevealEase {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 🟢 SVG-система плавных рамок с течением из точек "1" -->
    <svg class="wave-container" viewBox="0 0 400 800" preserveAspectRatio="none">
        <!-- Путь прописан с изгибами (Q/C команды), чтобы линии были волнообразными, а не прямыми -->
        <path class="liquid-wave-path" d="M 400 400 Q 395 200 400 0 L 0 0 Q 5 200 0 400 Q 5 600 0 800 L 400 800 Q 395 600 400 400 Z" />
    </svg>

    <!-- 🪐 ЕДИНОЕ ИИ-ЯДРО (Галочка + Текст, чистый фон) -->
    <div class="core-success-block">
        <svg class="apple-checkmark-svg" viewBox="0 0 52 52">
            <circle class="circle-path" cx="26" cy="26" r="24.5"/>
            <path class="check-path" d="M16 27.5 L22.5 34 L36.5 19.5"/>
        </svg>
        <h1 class="main-title">Оплата прошла успешно!</h1>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (Материализуется внизу позже) -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Celebration Success</title>
    <!-- Подключаем ультралегкую и плавную библиотеку конфетти (мировой стандарт) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #FFFFFF; /* Чистый премиальный фон */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* 🪐 ЦЕНТРАЛЬНЫЙ БЛОК */
        .status-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .apple-checkmark-svg {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 20px rgba(20, 200, 86, 0.15));
            overflow: visible;
        }

        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: drawCircle 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            /* Стрелка вылетает ровно к слову "Успешно" на 1.2 сек */
            animation: drawCheck 0.4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        /* 🎤 СТИЛИ ДЛЯ ПОЭТАПНОГО ВЫЛЕТА СЛОВ (APPLE STYLE) */
        .word-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .word {
            font-size: 28px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(15px);
        }

        /* Слово 1: Оплата */
        .word-1 {
            animation: wordPopIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards;
        }

        /* Слово 2: прошла */
        .word-2 {
            animation: wordPopIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards;
        }

        /* Слово 3: успешно! */
        .word-3 {
            color: #14C856; /* Выделяем финальное триумфальное слово твоим зеленым цветом */
            font-size: 32px; /* Чуть крупнее для акцента */
            animation: wordPopInIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards;
        }

        @keyframes wordPopIn {
            to { opacity: 1; transform: translateY(0); }
        }
        /* Финальное слово влетает с легким пружинящим эффектом */
        @keyframes wordPopInIn {
            to { opacity: 1; transform: translateY(0) scale(1.05); }
        }

        /* 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (ВЫКАТЫВАЕТСЯ ПОЗЖЕ) */
        .premium-receipt-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
            
            opacity: 0;
            transform: scale(0.96) translateY(30px);
            /* Выкатывается на 2.4 секунде, когда салют из конфетти уже в разгаре */
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        .info-container {
            background: #F8F9FA;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.005);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.15);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        /* Базовые тайминги анимаций */
        @keyframes drawCircle { to { stroke-dashoffset: 0; } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }
        @keyframes receiptRevealEase { to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>

    <!-- 🪐 ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
    <div class="status-center">
        <svg class="apple-checkmark-svg" viewBox="0 0 60 60">
            <circle class="circle-path" cx="30" cy="30" r="25"/>
            <path class="check-path" d="M20 31 L26.5 37.5 L40.5 23"/>
        </svg>
        
        <!-- Построчный вылет слов -->
        <div class="word-container">
            <div class="word word-1">Оплата</div>
            <div class="word word-2">прошла</div>
            <div class="word word-3">успешно!</div>
        </div>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-close btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

    <!-- 🚀 СКРИПТ ВЗРЫВА КОНФЕТТИ В СИНХРОНЕ С ПОСЛЕДНИМ СЛОВОМ -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Запуск салюта ровно на 1300 мс (момент появления слова "успешно!" и щелчка галочки)
            setTimeout(() => {
                // Первый залп из центра
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.35 },
                    colors: ['#14C856', '#A3F7B5', '#0ED95A', '#FFD700', '#FF4136'] // Твои зеленые + золотой и красный для сочности
                });

                // Боковые залпы для объема (эффект стадиона)
                setTimeout(() => {
                    confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0, y: 0.4 } });
                    confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1, y: 0.4 } });
                }, 150);
                
            }, 1300);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Corrected Premium Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🔮 1. ЗАДНИЙ СЛОЙ: СИММЕТРИЧНАЯ АУРА СТРОГО ПОД КОНТЕНТОМ (z-index: 1) */
        .aura-system {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1; /* Опустили на самый нижний слой, под текст и галочку */
            overflow: hidden;
            opacity: 0;
            animation: 
                auraWaveIn 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                auraPulseAndFade 1.0s cubic-bezier(0.25, 1, 0.5, 1) 1.8s forwards;
        }

        /* Левое облако (аккуратный заход с левого края) */
        .aura-left {
            position: absolute;
            top: 50%; 
            left: -50%; /* Сместили глубже к краю, чтобы не заливало центр */
            width: 80vh; height: 80vh;
            transform: translateY(-50%);
            background: radial-gradient(circle at center, #14C856 0%, #A3F7B5 30%, rgba(255,255,255,0) 65%);
            filter: blur(60px);
            animation: fluidBreatheLeft 5s infinite ease-in-out;
        }

        /* Правое облако (аккуратный заход с правого края) */
        .aura-right {
            position: absolute;
            top: 50%; 
            right: -50%; /* Абсолютно зеркально левому */
            width: 80vh; height: 80vh;
            transform: translateY(-50%);
            background: radial-gradient(circle at center, #14C856 0%, #A3F7B5 30%, rgba(255,255,255,0) 65%);
            filter: blur(60px);
            animation: fluidBreatheRight 5s infinite ease-in-out;
        }

        @keyframes auraWaveIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fluidBreatheLeft {
            0%, 100% { transform: translateY(-50%) scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-48%) scale(1.08) rotate(8deg); opacity: 1; }
        }
        @keyframes fluidBreatheRight {
            0%, 100% { transform: translateY(-50%) scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-52%) scale(1.08) rotate(-8deg); opacity: 1; }
        }

        @keyframes auraPulseAndFade {
            0% { filter: brightness(1); opacity: 1; }
            25% { filter: brightness(1.2); opacity: 0.4; }
            50% { filter: brightness(1.25); opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }


        /* 🪐 2. ПЕРЕДНИЙ СЛОЙ: ЕДИНОЕ ИИ-ЯДРО ПОВЕРХ ГРАДИЕНТА (z-index: 100) */
        .core-success-block {
            text-align: center;
            z-index: 100; /* Всегда поверх градиента */
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 32%;
            transform: translateY(-50%);
        }

        .apple-checkmark-svg {
            width: 100px; height: 100px;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 16px rgba(20, 200, 86, 0.15));
        }

        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: syncCircle 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: syncCheck 0.9s cubic-bezier(0.25, 1, 0.5, 1) 0.9s forwards;
        }

        @keyframes syncCircle { to { stroke-dashoffset: 0; } }
        @keyframes syncCheck { to { stroke-dashoffset: 0; } }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(12px);
            animation: titleFadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 1.3s forwards;
        }
        @keyframes titleFadeIn { to { opacity: 1; transform: translateY(0); } }


        /* 🧾 3. ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (z-index: 10) */
        .premium-receipt-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.04);
            z-index: 10;
            position: absolute;
            bottom: 6%;
            
            opacity: 0;
            transform: scale(0.96) translateY(35px);
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.6s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        .info-container {
            background: #F8F9FA;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.005);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.15);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes receiptRevealEase {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 🔮 СИММЕТРИЧНАЯ АУРА ИИ (Теперь строго НАД ФОНОМ, под элементами) -->
    <div class="aura-system">
        <div class="aura-left"></div>
        <div class="aura-right"></div>
    </div>

    <!-- 🪐 ЕДИНОЕ ИИ-ЯДРО (Поверх градиента) -->
    <div class="core-success-block">
        <svg class="apple-checkmark-svg" viewBox="0 0 52 52">
            <circle class="circle-path" cx="26" cy="26" r="24.5"/>
            <path class="check-path" d="M16 27.5 L22.5 34 L36.5 19.5"/>
        </svg>
        <h1 class="main-title">Оплата прошла успешно!</h1>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>

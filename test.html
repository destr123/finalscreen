<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Premium Liquid Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #F4F6F8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🌊 СИСТЕМА ЖИДКИХ РАМОК (ТОЛСТЫЕ И ОБЪЕМНЫЕ) */
        .liquid-border-container {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            z-index: 9999;
        }

        .liquid-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 8px; /* 🟢 Сделали рамку значительно шире и заметнее */
            stroke-linecap: round;
            
            /* Глубокое объемное ИИ-свечение */
            filter: drop-shadow(0 0 16px rgba(20, 200, 86, 0.7)) drop-shadow(0 0 6px rgba(20, 200, 86, 0.9));
            
            /* Настройка старта ровно из середины боковых граней (Координата 1) */
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            
            /* Плавно течет 1.5 секунды, затем мигает и гаснет */
            animation: 
                liquidFlow 1.5s cubic-bezier(0.42, 0, 0.58, 1) forwards,
                blinkAndFadeOut 0.9s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
        }

        /* 🎬 АНИМАЦИЯ: ТЕЧЕНИЕ ВОДЫ ИЗ ТОЧЕК "1" ДО ПОЛНОГО СМЫКАНИЯ */
        @keyframes liquidFlow {
            0% {
                stroke-dasharray: 0 4000;
                stroke-dashoffset: -1000; /* Математическое смещение в центр боковых рамок */
            }
            100% {
                stroke-dasharray: 4000 0;
                stroke-dashoffset: 0; /* Рамка полностью заполнена водой */
            }
        }

        /* 🎬 ПРЕМИАЛЬНОЕ МИГАНИЕ И ПЛАВНОЕ РАСТВОРЕНИЕ */
        @keyframes blinkAndFadeOut {
            0% { opacity: 1; filter: drop-shadow(0 0 20px rgba(20, 200, 86, 0.9)); stroke-width: 10px; }
            25% { opacity: 0.3; }
            50% { opacity: 1; filter: drop-shadow(0 0 30px rgba(20, 200, 86, 1)); stroke-width: 12px; }
            75% { opacity: 0.4; }
            100% { opacity: 0; display: none; filter: drop-shadow(0 0 0px rgba(0,0,0,0)); }
        }

        /* 🪐 ЦЕНТРАЛЬНОЕ ИИ-ЯДРО (ГАЛОЧКА) */
        .animation-core {
            position: absolute;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Гаснет в идеальном синхроне с внешними рамками */
            animation: blinkAndFadeOut 0.9s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
        }

        .apple-checkmark-svg {
            width: 100px; height: 100px;
            filter: drop-shadow(0 10px 25px rgba(20, 200, 86, 0.35));
        }

        /* КРУГ ГАЛОЧКИ РИСУЕТСЯ СИНХРОННО С ТЕЧЕНИЕМ ВОДЫ */
        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: syncCircleDuration 1.5s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        /* СТРЕЛКА ДОРИСОВЫВАЕТСЯ СТРОГО К МОМЕНТУ СМЫКАНИЯ РАМОК */
        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: syncCheckDuration 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.7s forwards;
        }

        @keyframes syncCircleDuration { to { stroke-dashoffset: 0; } }
        @keyframes syncCheckDuration { to { stroke-dashoffset: 0; } }

        /* 🧾 ДОРОГОЙ ЧЕК DXS PAY (ПОЯВЛЯЕТСЯ НА ЧИСТОМ ЭКРАНЕ) */
        .premium-receipt-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            padding: 36px 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.04);
            z-index: 10;
            
            opacity: 0;
            transform: scale(0.96) translateY(25px);
            /* Мягко выплывает на 2.2 секунде, когда световые волны полностью угасли */
            animation: receiptRevealEase 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
        }

        h1 { font-size: 24px; font-weight: 700; color: #111111; margin-bottom: 8px; letter-spacing: -0.4px; }
        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 24px; }

        .info-container {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.01);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }

        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.2);
            margin-bottom: 16px;
        }
        .btn-done:active { transform: scale(0.98); filter: brightness(0.9); }
        .brand-footer { font-size: 12px; color: #A9A9A9; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        @keyframes receiptRevealEase {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 🟢 Новая SVG-система толстых рамок с течением из точек "1" -->
    <svg class="liquid-border-container">
        <!-- Направляющая линия отрисована так, чтобы точки старта были ровно по центру боков -->
        <rect class="liquid-path" x="0" y="0" width="100%" height="100%" />
    </svg>

    <!-- 🪐 СИНХРОННОЕ СВЕТОВОЕ ЯДРО -->
    <div class="animation-core">
        <svg class="apple-checkmark-svg" viewBox="0 0 52 52">
            <circle class="circle-path" cx="26" cy="26" r="24.5"/>
            <path class="check-path" d="M16 27.5 L22.5 34 L36.5 19.5"/>
        </svg>
    </div>

    <!-- 🧾 ПРЕМИАЛЬНЫЙ ЧЕК DXS PAY (Чистый запуск после экшена) -->
    <div class="premium-receipt-card">
        <h1>Оплата прошла успешно!</h1>
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DxS Pay | Premium Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #F4F6F8; /* Дорогой благородный оттенок серого */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        /* 🟢 ПРЕМИАЛЬНАЯ НЕОНОВАЯ РАМКА GEMINI LIVE (Плавное "живое" свечение) */
        .premium-screen-border {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            border: 3.5px solid #14C856;
            pointer-events: none;
            z-index: 9999;
            border-radius: inherit;
            opacity: 0;
            
            /* Сложное глубокое свечение в стиле Apple/Gemini */
            box-shadow: 
                inset 0 0 20px rgba(20, 200, 86, 0.25), 
                0 0 25px rgba(20, 200, 86, 0.3),
                0 0 60px rgba(20, 200, 86, 0.15);
            
            /* Благородное, размеренное проявление и постоянное дыхание */
            animation: 
                borderFadeIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                geminiBreathe 4s infinite ease-in-out 1.5s;
        }

        /* Мягкие световые пятна ИИ на заднем плане */
        .ambient-glow {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(20, 200, 86, 0.07) 0%, rgba(244,246,248,0) 70%);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(50px);
            z-index: 1;
        }

        /* 🪐 ЦЕНТРАЛЬНЫЙ БЛОК УСПЕХА (APPLE STYLE) */
        .status-center {
            text-align: center;
            z-index: 10;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Векторная отрисовка премиальной галочки */
        .apple-checkmark-svg {
            width: 90px; height: 90px;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 24px rgba(20, 200, 86, 0.25));
        }
        .circle-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 3.5;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: drawCircle 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
        }
        .check-path {
            fill: none;
            stroke: #14C856;
            stroke-width: 4.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.6s cubic-bezier(0.4, 0, 0.2, 1) 1.0s forwards;
        }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(15px);
            animation: appleFadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards;
        }

        /* 💳 ДОРОГОЙ МАТОВЫЙ ЧЕК (GLASSMORPHISM) */
        .premium-receipt-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 358px;
            text-align: center;
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.02),
                0 20px 50px rgba(0, 0, 0, 0.04);
            z-index: 10;
            
            /* Инерционное плавное появление снизу (выкатывается позже) */
            opacity: 0;
            transform: translateY(40px) scale(0.97);
            animation: receiptReveal 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.1) 1.6s forwards;
        }

        .subtitle { font-size: 14px; color: #8E8E93; line-height: 1.4; margin-bottom: 20px; }

        /* Внутренние строки чека */
        .info-container {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #8E8E93; font-weight: 400; }
        .value { color: #111111; font-weight: 500; }
        .value.price { color: #14C856; font-weight: 700; font-size: 22px; letter-spacing: -0.3px; }

        /* КНОПКА ЗАКРЫТИЯ */
        .btn-done {
            display: block;
            width: 100%;
            background: #14C856;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 8px 24px rgba(20, 200, 86, 0.2);
            margin-bottom: 16px;
        }
        .btn-done:active {
            transform: scale(0.97);
            background: #11A647;
            box-shadow: 0 4px 12px rgba(20, 200, 86, 0.1);
        }

        .brand-footer { font-size: 12px; color: #A9A9A9; letter-spacing: -0.1px; }
        .brand-footer span { color: #14C856; font-weight: 600; }

        /* 🎬 КИНЕМАТОГРАФИЧНЫЕ ТАЙМИНГИ АНИМАЦИЙ */
        
        /* Проявление рамки */
        @keyframes borderFadeIn {
            to { opacity: 1; }
        }
        /* ИИ-дыхание контура */
        @keyframes geminiBreathe {
            0%, 100% { border-color: rgba(20, 200, 86, 0.85); box-shadow: inset 0 0 20px rgba(20, 200, 86, 0.2), 0 0 25px rgba(20, 200, 86, 0.25); }
            50% { border-color: rgba(20, 200, 86, 1); box-shadow: inset 0 0 35px rgba(20, 200, 86, 0.4), 0 0 40px rgba(20, 200, 86, 0.45); }
        }
        /* Рисование круга галочки */
        @keyframes drawCircle {
            to { stroke-dashoffset: 0; }
        }
        /* Рисование самой галочки */
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
        /* Появление заголовка */
        @keyframes appleFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        /* Выкатывание чека */
        @keyframes receiptReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Премиальный анимированный контур по экрану -->
    <div class="premium-screen-border"></div>
    
    <!-- ИИ-свечение -->
    <div class="ambient-glow"></div>

    <!-- 🌌 ЦЕНТР: Сначала фокус только здесь -->
    <div class="status-center">
        <svg class="apple-checkmark-svg" viewBox="0 0 52 52">
            <circle class="circle-path" cx="26" cy="26" r="24.5"/>
            <path class="check-path" d="M16 27.5 L22.5 34 L36.5 19.5"/>
        </svg>
        <h1 class="main-title">Оплата прошла успешно!</h1>
    </div>

    <!-- 🧾 НИЗ: Элегантный чек, который выезжает позже -->
    <div class="premium-receipt-card">
        <p class="subtitle">Спасибо за доверие. Чек уже отправлен в Telegram.</p>

        <div class="info-container">
            <div class="info-row">
                <span class="label">Назначение</span>
                <span class="value">Оплата услуги</span>
            </div>
            <div class="info-row">
                <span class="label">Сумма</span>
                <span class="value price">1.00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Номер платежа</span>
                <span class="value">#482910</span>
            </div>
        </div>

        <button class="btn-done">Закрыть страницу</button>
        
        <div class="brand-footer">
            Платёжная система <span>DxS Pay</span>
        </div>
    </div>

</body>
</html>
